<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Deploy Product Customer – Micro Animation</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Deploy Product Customer micro animation -->
  <div class="dpc" role="img" aria-label="A customer on a phone call connected to AI, IVR/IVA, Live Agent, Payments, eSignatures, Passkeys, eForms and OTP">
    <div class="dpc__stage" aria-hidden="true">

      <!-- Dotted connector lines -->
      <svg class="dpc__lines" viewBox="0 0 1200 901" fill="none">
        <defs>
          <mask id="dpc-lines-mask" maskUnits="userSpaceOnUse" x="0" y="0" width="1200" height="901">
            <g stroke="#fff" stroke-width="14">
              <path class="dpc__reveal dpc__reveal--1"  pathLength="1" d="M627 534 V379"/>
              <path class="dpc__reveal dpc__reveal--2"  pathLength="1" d="M627 255 V189"/>
              <path class="dpc__reveal dpc__reveal--3"  pathLength="1" d="M446 342 A330 330 0 0 0 362 421"/>
              <path class="dpc__reveal dpc__reveal--4"  pathLength="1" d="M799 336 A330 330 0 0 1 892 421"/>
              <path class="dpc__reveal dpc__reveal--5"  pathLength="1" d="M482 121 A518 518 0 0 0 365 171"/>
              <path class="dpc__reveal dpc__reveal--6"  pathLength="1" d="M769 121 A518 518 0 0 1 888 171"/>
              <path class="dpc__reveal dpc__reveal--7"  pathLength="1" d="M268 544 Q266 566 263 587"/>
              <path class="dpc__reveal dpc__reveal--8"  pathLength="1" d="M985 544 Q988 566 990 587"/>
              <path class="dpc__reveal dpc__reveal--9"  pathLength="1" d="M378 650 H329"/>
              <path class="dpc__reveal dpc__reveal--10" pathLength="1" d="M876 650 H919"/>
            </g>
          </mask>
        </defs>
        <g class="dpc__dots" mask="url(#dpc-lines-mask)" stroke="#006eb8" stroke-width="5">
          <path d="M627 534 V379"/>
          <path d="M627 255 V189"/>
          <path d="M446 342 A330 330 0 0 0 362 421"/>
          <path d="M799 336 A330 330 0 0 1 892 421"/>
          <path d="M482 121 A518 518 0 0 0 365 171"/>
          <path d="M769 121 A518 518 0 0 1 888 171"/>
          <path d="M268 544 Q266 566 263 587"/>
          <path d="M985 544 Q988 566 990 587"/>
          <path d="M378 650 H329"/>
          <path d="M876 650 H919"/>
        </g>
      </svg>

      <!-- Phone -->
      <div class="dpc__phone">
        <span class="dpc__phone-btn dpc__phone-btn--1"></span>
        <span class="dpc__phone-btn dpc__phone-btn--2"></span>
        <div class="dpc__screen">
          <svg class="dpc__wave" viewBox="0 0 462 420" fill="currentColor">
            <g><rect x="14" y="40" width="12" height="380" rx="6"/></g>
            <g><rect x="36" y="70" width="12" height="350" rx="6"/></g>
            <g><rect x="58" y="60" width="12" height="360" rx="6"/></g>
            <g><circle cx="86" cy="38" r="6"/><rect x="80" y="60" width="12" height="360" rx="6"/></g>
            <g><rect x="102" y="30" width="12" height="390" rx="6"/></g>
            <g><circle cx="130" cy="98" r="6"/><rect x="124" y="120" width="12" height="300" rx="6"/></g>
            <g><circle cx="152" cy="48" r="6"/><rect x="146" y="70" width="12" height="350" rx="6"/></g>
            <g><circle cx="174" cy="98" r="6"/><rect x="168" y="120" width="12" height="300" rx="6"/></g>
            <g><circle cx="196" cy="48" r="6"/><rect x="190" y="70" width="12" height="350" rx="6"/></g>
            <g><rect x="212" y="60" width="12" height="360" rx="6"/></g>
            <g><rect x="234" y="30" width="12" height="390" rx="6"/></g>
            <g><circle cx="262" cy="48" r="6"/><rect x="256" y="70" width="12" height="350" rx="6"/></g>
            <g><circle cx="284" cy="98" r="6"/><rect x="278" y="120" width="12" height="300" rx="6"/></g>
            <g><circle cx="306" cy="68" r="6"/><rect x="300" y="90" width="12" height="330" rx="6"/></g>
            <g><rect x="322" y="90" width="12" height="330" rx="6"/></g>
            <g><rect x="344" y="150" width="12" height="270" rx="6"/></g>
            <g><circle cx="372" cy="68" r="6"/><rect x="366" y="90" width="12" height="330" rx="6"/></g>
            <g><circle cx="394" cy="98" r="6"/><rect x="388" y="120" width="12" height="300" rx="6"/></g>
            <g><rect x="410" y="20" width="12" height="400" rx="6"/></g>
            <g><rect x="432" y="30" width="12" height="390" rx="6"/></g>
            <g><rect x="450" y="110" width="12" height="310" rx="6"/></g>
          </svg>

          <div class="dpc__status">
            <span class="dpc__clock">9:40</span>
            <svg class="dpc__status-icons" viewBox="0 0 88 14" fill="#fff">
              <!-- signal -->
              <rect x="0"  y="9" width="3.5" height="5"  rx="1"/>
              <rect x="5"  y="6.5" width="3.5" height="7.5" rx="1"/>
              <rect x="10" y="4" width="3.5" height="10" rx="1"/>
              <rect x="15" y="1.5" width="3.5" height="12.5" rx="1"/>
              <!-- wifi -->
              <path d="M38 13.5 L34.6 10 A5 5 0 0 1 41.4 10 Z"/>
              <path d="M30.6 6.6 A10.5 10.5 0 0 1 45.4 6.6 L43.6 8.5 A8 8 0 0 0 32.4 8.5 Z"/>
              <path d="M27.2 3.4 A15.5 15.5 0 0 1 48.8 3.4 L47.1 5.1 A13 13 0 0 0 28.9 5.1 Z" />
              <!-- battery -->
              <rect x="58.5" y="1" width="25" height="12" rx="3.6" fill="none" stroke="#fff" stroke-opacity=".4" stroke-width="1.2"/>
              <rect x="60.5" y="3" width="21" height="8" rx="2.2"/>
              <path d="M85.5 5 Q87.5 5.5 87.5 7 Q87.5 8.5 85.5 9 Z" fill-opacity=".4"/>
            </svg>
          </div>

          <div class="dpc__call">
            <span class="dpc__number">7205554897</span>
            <span class="dpc__timer"></span>
          </div>
        </div>
      </div>

      <!-- Customer -->
      <div class="dpc__avatar">
        <img src="customer.jpg" alt="" width="156" height="156">
      </div>

      <!-- IVR / IVA -->
      <div class="dpc__card dpc__card--dark dpc__card--ivr">
        <svg class="dpc__icon dpc__icon--ivr" viewBox="0 0 60 46" fill="none" stroke="#1a8ad0" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
          <path class="dpc__ivr-handset" d="M11 3 C6 3 3 8 3 20 C3 32 6 37 11 37 C13 37 14.5 35.5 14.5 33.5 L14.5 29 C14.5 27 13 26 11 26 L9.5 26 C8.5 22.5 8.5 17.5 9.5 14 L11 14 C13 14 14.5 13 14.5 11 L14.5 6.5 C14.5 4.5 13 3 11 3 Z"/>
          <path d="M11 37 Q11 43 19 43"/>
          <rect x="19" y="2" width="38" height="41" rx="3"/>
          <path d="M19 17 H57"/>
          <g class="dpc__ivr-keys" fill="#1a8ad0" stroke="none">
            <circle cx="30" cy="26" r="1.9"/><circle cx="38" cy="26" r="1.9"/><circle cx="46" cy="26" r="1.9"/>
            <circle cx="30" cy="34" r="1.9"/><circle cx="38" cy="34" r="1.9"/><circle cx="46" cy="34" r="1.9"/>
          </g>
        </svg>
        <span class="dpc__label">IVR/IVA</span>
      </div>

      <!-- AI -->
      <div class="dpc__card dpc__card--dark dpc__card--ai">
        <svg class="dpc__icon dpc__icon--ai" viewBox="0 0 48 48" fill="none" stroke="#1a8ad0" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
          <path class="dpc__ai-star" d="M21 10 C22.6 20.5 25 23.4 35 27 C25 30.6 22.6 33.5 21 44 C19.4 33.5 17 30.6 7 27 C17 23.4 19.4 20.5 21 10 Z"/>
          <path class="dpc__ai-plus" d="M39 3 V13 M34 8 H44"/>
        </svg>
        <span class="dpc__label">AI</span>
      </div>

      <!-- Live Agent -->
      <div class="dpc__card dpc__card--dark dpc__card--live">
        <svg class="dpc__icon dpc__icon--live" viewBox="0 0 48 52" fill="none" stroke="#1a8ad0" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
          <path d="M35 49 V40 C40.5 36.5 43.5 30.5 43.5 23.5 C43.5 12.5 35 4 24.5 4 C15 4 8 10.5 6.8 19 L3.5 27.5 L7.5 28.5 L7.5 34.5 C7.5 37 9.5 38.5 12 38.5 L15.5 38.5 V43"/>
          <rect x="22" y="3" width="8" height="16" rx="2"/>
          <circle class="dpc__live-cup" cx="26" cy="25.5" r="6.5"/>
          <path d="M26 32 C26 36 21 38 16 37.5"/>
        </svg>
        <span class="dpc__label">Live Agent</span>
      </div>

      <!-- Payments -->
      <div class="dpc__card dpc__card--light dpc__card--pay">
        <svg class="dpc__icon dpc__icon--pay" viewBox="0 0 80 80">
          <path class="dpc__pay-card" d="M27 26 L33.5 10.5 Q35 7 39 7.8 L60 12.5 Q64 13.5 64 17.5 L64 26 Z" fill="#b5e3bb"/>
          <path d="M13 20 Q13 11.5 21.5 11.5 Q26 11.5 26 15.8 Q26 20 21.5 20 Q19.8 20 19.8 22 Q19.8 25 23.5 25 H65 Q71.5 25 71.5 31.5 V65 Q71.5 73.5 63 73.5 H21.5 Q13 73.5 13 65 Z" fill="#5ec269"/>
          <circle cx="58" cy="52" r="5.5" fill="#b5e3bb"/>
        </svg>
        <span class="dpc__label">Payments</span>
      </div>

      <!-- eSignatures -->
      <div class="dpc__card dpc__card--light dpc__card--esig">
        <svg class="dpc__icon dpc__icon--esig" viewBox="0 0 80 80">
          <path d="M18 7 H44 L58 21 V62 Q58 71 49 71 H18 Q9 71 9 62 V16 Q9 7 18 7 Z" fill="#f3d299"/>
          <path d="M44 7 L58 21 H50 Q44 21 44 15 Z" fill="#f09e0f"/>
          <rect class="dpc__esig-line dpc__esig-line--1" x="20" y="29" width="13" height="4.5" rx="2.25" fill="#f09e0f"/>
          <rect class="dpc__esig-line dpc__esig-line--2" x="20" y="39" width="22" height="4.5" rx="2.25" fill="#f09e0f"/>
          <path class="dpc__esig-leaf" d="M45 77 C44.5 60 54 48.5 73 46.5 C73.5 63.5 63.5 73 48 73" fill="#f09e0f" stroke="#fff" stroke-width="5" stroke-linejoin="round" paint-order="stroke"/>
        </svg>
        <span class="dpc__label">eSignatures</span>
      </div>

      <!-- Passkeys -->
      <div class="dpc__card dpc__card--light dpc__card--pass">
        <span class="dpc__label">Passkeys</span>
        <svg class="dpc__icon dpc__icon--pass" viewBox="0 0 80 80">
          <g class="dpc__pass-frame" fill="none" stroke="#adc7f3" stroke-width="6" stroke-linecap="round">
            <path d="M13 28 V20 Q13 15 18 13.5 L31 9.5"/>
            <path d="M67 28 V20 Q67 15 62 13.5 L49 9.5"/>
            <path d="M13 50 Q14.5 62 29 71"/>
            <path d="M67 50 Q65.5 62 51 71"/>
          </g>
          <circle cx="40" cy="30" r="10.5" fill="#3b82f6"/>
          <ellipse cx="40" cy="55.5" rx="17.5" ry="11" fill="#3b82f6"/>
          <rect class="dpc__pass-scan" x="18" y="16" width="44" height="3" rx="1.5" fill="#3b82f6"/>
        </svg>
      </div>

      <!-- eForms -->
      <div class="dpc__card dpc__card--light dpc__card--eforms">
        <svg class="dpc__icon dpc__icon--eforms" viewBox="0 0 90 80">
          <rect x="6" y="10" width="76" height="42" rx="12" fill="#f1d4d8"/>
          <path d="M50 10 H70 Q82 10 82 22 V40 Q82 52 70 52 H50 Z" fill="#ecb4ba"/>
          <path class="dpc__eforms-caret" d="M60 26 H72 L66 34 Z" fill="#e14f62" stroke="#e14f62" stroke-width="2" stroke-linejoin="round"/>
          <path class="dpc__eforms-cursor" d="M25 38 L56 50 Q58.5 51 56 52.5 L45.5 56.5 L39.5 70 Q38.5 72.5 37.5 70 Z" fill="#e14f62" stroke="#fff" stroke-width="6" stroke-linejoin="round" paint-order="stroke"/>
        </svg>
        <span class="dpc__label">eForms</span>
      </div>

      <!-- OTP -->
      <div class="dpc__card dpc__card--light dpc__card--otp">
        <span class="dpc__label">OTP</span>
        <svg class="dpc__icon dpc__icon--otp" viewBox="0 0 90 52">
          <g fill="none" stroke="#a14dfd" stroke-width="5.5" stroke-linecap="round">
            <path class="dpc__otp-star dpc__otp-star--1" d="M15 6 V30 M4.6 12 L25.4 24 M4.6 24 L25.4 12"/>
            <path class="dpc__otp-star dpc__otp-star--2" d="M45 6 V30 M34.6 12 L55.4 24 M34.6 24 L55.4 12"/>
            <path class="dpc__otp-star dpc__otp-star--3" d="M75 6 V30 M64.6 12 L85.4 24 M64.6 24 L85.4 12"/>
          </g>
          <rect class="dpc__otp-line dpc__otp-line--1" x="3"  y="42" width="24" height="5.5" rx="2.75"/>
          <rect class="dpc__otp-line dpc__otp-line--2" x="33" y="42" width="24" height="5.5" rx="2.75"/>
          <rect class="dpc__otp-line dpc__otp-line--3" x="63" y="42" width="24" height="5.5" rx="2.75"/>
        </svg>
      </div>

    </div>
  </div>

</body>
</html>
